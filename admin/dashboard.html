<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Designer Portfolio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Poppins, sans-serif;
            background: #0A0E27;
            color: #E0E0E0;
        }

        .admin-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: linear-gradient(135deg, #0A0E27, #050812);
            border-right: 1px solid rgba(0, 119, 255, 0.2);
            padding: 2rem 1rem;
            position: fixed;
            height: 100vh;
            width: 250px;
            overflow-y: auto;
        }

        .logo {
            color: #0077FF;
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item {
            padding: 1rem;
            background: transparent;
            border: none;
            color: #A0A0A0;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
        }

        .nav-item:hover {
            background: rgba(0, 119, 255, 0.1);
            color: #0077FF;
        }

        .nav-item.active {
            background: rgba(0, 119, 255, 0.2);
            color: #0077FF;
            border-left: 3px solid #0077FF;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(0, 119, 255, 0.2);
            padding-bottom: 1rem;
        }

        .page-title {
            font-size: 2rem;
            font-family: 'Space Grotesk', sans-serif;
            color: #0077FF;
        }

        .logout-btn {
            background: linear-gradient(135deg, #0077FF, #4DA8FF);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            box-shadow: 0 0 20px rgba(0, 119, 255, 0.6);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(0, 119, 255, 0.05);
            border: 1px solid rgba(0, 119, 255, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2.5rem;
            color: #0077FF;
            margin-bottom: 0.5rem;
        }

        .stat-card p {
            color: #A0A0A0;
            font-size: 0.9rem;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .data-table {
            width: 100%;
            background: rgba(0, 119, 255, 0.05);
            border: 1px solid rgba(0, 119, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(0, 119, 255, 0.1);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #0077FF;
            border-bottom: 1px solid rgba(0, 119, 255, 0.2);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(0, 119, 255, 0.1);
        }

        tr:hover {
            background: rgba(0, 119, 255, 0.08);
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-confirmed {
            background: rgba(0, 170, 0, 0.2);
            color: #00DD00;
        }

        .status-pending {
            background: rgba(255, 170, 0, 0.2);
            color: #FFAA00;
        }

        .status-new {
            background: rgba(0, 119, 255, 0.2);
            color: #0077FF;
        }

        .action-btn {
            background: transparent;
            border: 1px solid #0077FF;
            color: #0077FF;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            margin-right: 0.5rem;
        }

        .action-btn:hover {
            background: rgba(0, 119, 255, 0.2);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #0077FF;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 119, 255, 0.3);
            border-radius: 6px;
            color: #E0E0E0;
            font-family: Poppins, sans-serif;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #0077FF;
            box-shadow: 0 0 15px rgba(0, 119, 255, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #0077FF, #4DA8FF);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            box-shadow: 0 0 20px rgba(0, 119, 255, 0.6);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #A0A0A0;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #A0A0A0;
        }

        @media (max-width: 768px) {
            .admin-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                height: auto;
                width: 100%;
            }

            .main-content {
                margin-left: 0;
            }

            .nav-menu {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <i class="fas fa-crown"></i> Admin
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-section="dashboard">
                    <i class="fas fa-chart-line"></i> Dashboard
                </button>
                <button class="nav-item" data-section="bookings">
                    <i class="fas fa-calendar"></i> Bookings
                </button>
                <button class="nav-item" data-section="messages">
                    <i class="fas fa-envelope"></i> Messages
                </button>
                <button class="nav-item" data-section="newsletter">
                    <i class="fas fa-envelope-open"></i> Newsletter
                </button>
                <button class="nav-item" data-section="payments">
                    <i class="fas fa-credit-card"></i> Payments
                </button>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1 class="page-title">Admin Dashboard</h1>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>

            <!-- Dashboard Section -->
            <div class="section active" id="dashboard">
                <h2 style="margin-bottom: 1.5rem; color: #0077FF;">📊 Overview</h2>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <h3>0</h3>
                        <p>Total Bookings</p>
                    </div>
                    <div class="stat-card">
                        <h3>$0</h3>
                        <p>Revenue</p>
                    </div>
                    <div class="stat-card">
                        <h3>0</h3>
                        <p>Messages</p>
                    </div>
                    <div class="stat-card">
                        <h3>0</h3>
                        <p>Subscribers</p>
                    </div>
                </div>
                <h3 style="color: #0077FF; margin-top: 2rem; margin-bottom: 1rem;">📅 Recent Bookings</h3>
                <div class="data-table" id="recentBookingsTable">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <!-- Bookings Section -->
            <div class="section" id="bookings">
                <h2 style="margin-bottom: 1.5rem; color: #0077FF;">📅 Manage Bookings</h2>
                <div class="data-table" id="bookingsTable">
                    <div class="loading">Loading bookings...</div>
                </div>
            </div>

            <!-- Messages Section -->
            <div class="section" id="messages">
                <h2 style="margin-bottom: 1.5rem; color: #0077FF;">💬 Contact Messages</h2>
                <div class="data-table" id="messagesTable">
                    <div class="loading">Loading messages...</div>
                </div>
            </div>

            <!-- Newsletter Section -->
            <div class="section" id="newsletter">
                <h2 style="margin-bottom: 1.5rem; color: #0077FF;">📧 Newsletter Subscribers</h2>
                <div class="data-table" id="newsletterTable">
                    <div class="loading">Loading subscribers...</div>
                </div>
            </div>

            <!-- Payments Section -->
            <div class="section" id="payments">
                <h2 style="margin-bottom: 1.5rem; color: #0077FF;">💳 Payment History</h2>
                <div class="data-table" id="paymentsTable">
                    <div class="loading">Loading payments...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let authToken = localStorage.getItem('adminToken');

        // Navigation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const section = this.getAttribute('data-section');
                switchSection(section);
            });
        });

        function switchSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(section).classList.add('active');
            document.querySelector(`[data-section="${section}"]`).classList.add('active');

            if (section === 'bookings') loadBookings();
            if (section === 'messages') loadMessages();
            if (section === 'newsletter') loadNewsletter();
            if (section === 'payments') loadPayments();
        }

        // Load Dashboard Stats
        function loadDashboardStats() {
            Promise.all([
                fetch(`${API_URL}/bookings`, { headers: authToken ? { 'Authorization': `Bearer ${authToken}` } }).then(r => r.json()),
                fetch(`${API_URL}/contact`, { headers: authToken ? { 'Authorization': `Bearer ${authToken}` } }).then(r => r.json()),
                fetch(`${API_URL}/newsletter/stats/overview`, { headers: authToken ? { 'Authorization': `Bearer ${authToken}` } }).then(r => r.json()),
                fetch(`${API_URL}/payments`, { headers: authToken ? { 'Authorization': `Bearer ${authToken}` } }).then(r => r.json())
            ]).then(([bookings, messages, newsletter, payments]) => {
                const stats = document.querySelectorAll('.stat-card');
                stats[0].innerHTML = `<h3>${bookings.length || 0}</h3><p>Total Bookings</p>`;
                stats[1].innerHTML = `<h3>$${payments.stats?.totalAmount || 0}</h3><p>Revenue</p>`;
                stats[2].innerHTML = `<h3>${messages.length || 0}</h3><p>Messages</p>`;
                stats[3].innerHTML = `<h3>${newsletter.active || 0}</h3><p>Subscribers</p>`;

                if (bookings.length > 0) {
                    renderRecentBookings(bookings.slice(0, 5));
                }
            });
        }

        function renderRecentBookings(bookings) {
            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Service</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${bookings.map(b => `
                            <tr>
                                <td>${b.name}</td>
                                <td>${b.service}</td>
                                <td>${new Date(b.date).toLocaleDateString()}</td>
                                <td><span class="status-badge status-${b.status}">${b.status}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('recentBookingsTable').innerHTML = html;
        }

        async function loadBookings() {
            try {
                const response = await fetch(`${API_URL}/bookings`, {
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                const bookings = await response.json();
                
                const html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Service</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${bookings.map(b => `
                                <tr>
                                    <td>${b.name}</td>
                                    <td>${b.email}</td>
                                    <td>${b.service}</td>
                                    <td>${new Date(b.date).toLocaleDateString()}</td>
                                    <td><span class="status-badge status-${b.status}">${b.status}</span></td>
                                    <td>
                                        <button class="action-btn" onclick="deleteBooking('${b._id}')">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('bookingsTable').innerHTML = html;
            } catch (error) {
                console.error('Error loading bookings:', error);
                document.getElementById('bookingsTable').innerHTML = '<div class="empty-state">No bookings found</div>';
            }
        }

        async function loadMessages() {
            try {
                const response = await fetch(`${API_URL}/contact`, {
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                const messages = await response.json();
                
                const html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Subject</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${messages.map(m => `
                                <tr>
                                    <td>${m.name}</td>
                                    <td>${m.email}</td>
                                    <td>${m.subject}</td>
                                    <td><span class="status-badge status-${m.status}">${m.status}</span></td>
                                    <td>
                                        <button class="action-btn" onclick="deleteMessage('${m._id}')">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('messagesTable').innerHTML = html;
            } catch (error) {
                console.error('Error loading messages:', error);
                document.getElementById('messagesTable').innerHTML = '<div class="empty-state">No messages found</div>';
            }
        }

        async function loadNewsletter() {
            try {
                const response = await fetch(`${API_URL}/newsletter`, {
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                const data = await response.json();
                
                const html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Subscribed</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.subscribers?.map(s => `
                                <tr>
                                    <td>${s.email}</td>
                                    <td>${s.firstName || '-'}</td>
                                    <td>${s.lastName || '-'}</td>
                                    <td>${s.subscribed ? '✓' : '✗'}</td>
                                </tr>
                            `).join('') || '<tr><td colspan="4" style="text-align: center;">No subscribers</td></tr>'}
                        </tbody>
                    </table>
                `;
                document.getElementById('newsletterTable').innerHTML = html;
            } catch (error) {
                console.error('Error loading newsletter:', error);
                document.getElementById('newsletterTable').innerHTML = '<div class="empty-state">No subscribers found</div>';
            }
        }

        async function loadPayments() {
            try {
                const response = await fetch(`${API_URL}/payments`, {
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                const data = await response.json();
                
                const html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Service</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.payments?.map(p => `
                                <tr>
                                    <td>${p.email}</td>
                                    <td>${p.service}</td>
                                    <td>$${p.amount}</td>
                                    <td><span class="status-badge status-${p.status}">${p.status}</span></td>
                                    <td>${new Date(p.createdAt).toLocaleDateString()}</td>
                                </tr>
                            `).join('') || '<tr><td colspan="5" style="text-align: center;">No payments</td></tr>'}
                        </tbody>
                    </table>
                `;
                document.getElementById('paymentsTable').innerHTML = html;
            } catch (error) {
                console.error('Error loading payments:', error);
                document.getElementById('paymentsTable').innerHTML = '<div class="empty-state">No payments found</div>';
            }
        }

        async function deleteBooking(id) {
            if (confirm('Are you sure?')) {
                await fetch(`${API_URL}/bookings/${id}`, {
                    method: 'DELETE',
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                loadBookings();
            }
        }

        async function deleteMessage(id) {
            if (confirm('Are you sure?')) {
                await fetch(`${API_URL}/contact/${id}`, {
                    method: 'DELETE',
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                loadMessages();
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'login.html';
        }

        // Load dashboard on page load
        loadDashboardStats();
    </script>
</body>
</html>
