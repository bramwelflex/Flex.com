<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Designer Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Poppins, sans-serif;
            background: linear-gradient(135deg, #0A0E27 0%, #050812 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #E0E0E0;
        }

        .login-container {
            background: rgba(10, 14, 39, 0.8);
            border: 1px solid rgba(0, 119, 255, 0.3);
            border-radius: 12px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 119, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            color: #0077FF;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #0077FF;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #0077FF;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 119, 255, 0.3);
            border-radius: 6px;
            color: #E0E0E0;
            font-family: Poppins, sans-serif;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #0077FF;
            background: rgba(0, 119, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 119, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #0077FF, #4DA8FF);
            border: none;
            color: white;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn:hover {
            box-shadow: 0 0 30px rgba(0, 119, 255, 0.6);
            transform: translateY(-2px);
        }

        .error {
            background: rgba(255, 68, 68, 0.1);
            color: #FF4444;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }

        .error.show {
            display: block;
        }

        .info {
            text-align: center;
            color: #A0A0A0;
            font-size: 0.9rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">👑</div>
        <h1>Admin Login</h1>
        
        <div class="error" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div class="info">
            <p>🔐 Secure admin access</p>
            <p style="margin-top: 0.5rem; font-size: 0.8rem; color: #808080;">Make sure backend is running on localhost:5000</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // Store token and redirect
                localStorage.setItem('adminToken', data.token);
                window.location.href = 'dashboard.html';
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.add('show');
                setTimeout(() => {
                    errorMsg.classList.remove('show');
                }, 5000);
            }
        });
    </script>
</body>
</html>
